[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify_profile_monitor"
version = "3.8"
description = "Track Spotify profile, follower and playlist changes in real time"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Michal Szymanski", email = "misiektoja-pypi@rm-rf.ninja" }]
requires-python = ">=3.9"
dependencies = [
  "requests>=2.0",
  "python-dateutil>=2.8",
  "urllib3>=2.0.7",
  "pyotp>=2.9.0",
  "pytz>=2020.1",
  "tzlocal>=4.0",
  "python-dotenv>=0.19",
  "spotipy>=2.24.0",
  "wcwidth>=0.2.7",
  "pathvalidate>=3.2.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
keywords = ["spotify", "monitoring", "tracking", "real-time", "playlists", "osint"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pyyaml>=6.0", "Pillow>=11.3.0,<12; python_version < '3.10'", "Pillow>=12.0.0; python_version >= '3.10'"]
# Pinned so a new ruff release cannot fail CI on a rule that did not exist when the change was written
lint = ["ruff==0.16.4"]
# Pillow 12 dropped Python 3.9, so 3.9 keeps the last release that supports it while 3.10 and newer get the current one
notification-images = ["Pillow>=11.3.0,<12; python_version < '3.10'", "Pillow>=12.0.0; python_version >= '3.10'"]
# Needed only to import Chrome/Brave/Chromium cookies (--import-browser-cookie); macOS and Linux only
browser = ["pycookiecheat>=0.8"]

[project.urls]
Homepage = "https://github.com/misiektoja/spotify_profile_monitor"
Source   = "https://github.com/misiektoja/spotify_profile_monitor"
Changelog= "https://github.com/misiektoja/spotify_profile_monitor/blob/main/RELEASE_NOTES.md"

[project.scripts]
spotify_profile_monitor = "spotify_profile_monitor:main"

[tool.setuptools]
py-modules = ["spotify_profile_monitor"]
include-package-data = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Defect rules only: syntax errors, pyflakes and bugbear. Formatting and import order are left
# to the surrounding code, which keeps each function definition on one physical line
select = ["E9", "F", "B"]
# Both are style preferences that would rewrite hundreds of existing lines without fixing a defect
ignore = ["F541", "B904"]

[tool.pytest.ini_options]
# Run the in-repo source, never an installed copy, by putting the project root first on sys.path
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
